name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite deliberately needs no third-party packages, so there is
      # nothing to install. Tests that require media or the example project
      # skip themselves.
      - name: Run tests
        run: PYTHONPATH=. python -m unittest discover -s tests -t . -v

      - name: Byte-compile everything
        run: python -m compileall -q abcoder tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check abcoder tests
